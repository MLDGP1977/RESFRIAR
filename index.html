    window.salvarNovoVeiculo = async () => {
      const id = String(document.getElementById("novoVeiId")?.value || "").trim();
      const placa = String(document.getElementById("novoVeiPlaca")?.value || "").trim() || "---";
      const tecnico = String(document.getElementById("novoVeiTecnico")?.value || "").trim();

      if (!id) return showSystemAlert("Informe o identificador da van.");
      if ((appState.vehicles || []).some(veh => String(veh.id) === id)) {
        return showSystemAlert(`Já existe um veículo com o identificador "${id}".`);
      }

      // Verifica se o técnico já está associado a outro veículo
      let outroVeiculo = null;
      if (tecnico) {
        outroVeiculo = (appState.vehicles || []).find(veh => String(veh.tecnico || "").trim() === tecnico);
        if (outroVeiculo) {
          const confirmou = await new Promise((resolve) => {
            openModal(`
        <div style="margin-bottom:14px;">
          <h3 style="margin:0 0 8px; font-size:17px;">⚠️ Técnico já associado</h3>
          <div style="font-size:13px; line-height:1.6;">
            O técnico <strong>${tecnico}</strong> já está associado ao veículo
            <strong>${outroVeiculo.id}</strong>.<br><br>
            Deseja alterar a associação para <strong>${id}</strong>?
          </div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn-action btn-outline" style="flex:1;" onclick="closeModal(); window.__resTecVeic(false);">Não, cancelar</button>
          <button class="btn-action btn-primary" style="flex:1;" onclick="closeModal(); window.__resTecVeic(true);">Sim, alterar associação</button>
        </div>`);
            window.__resTecVeic = (r) => resolve(r);
          });
          if (!confirmou) return;
        }
      }

      const novoVeiculo = { id, veiculo: id, placa, tecnico, km: 0, status: "OK", checklist: "Pendente", pendencias: 0 };
      await api("criarVeiculo", novoVeiculo);

      try {
        const { db, doc, setDoc } = fbFns();
        const agora = new Date().toISOString();

        // Associa o veículo ao técnico no cadastro de usuários
        if (tecnico) {
          const novo = (appState.usuarios || []).find(u2 => String(u2.nome || "").trim() === tecnico);
          if (novo) {
            await setDoc(doc(db, "usuarios", String(novo.id || novo.usuario)), {
              veiculo: id,
              atualizadoEm: agora
            }, { merge: true });
            novo.veiculo = id;
          }
        }

        // Desvincula o técnico do veículo anterior, se houve conflito confirmado
        if (outroVeiculo) {
          outroVeiculo.tecnico = "";
          await api("atualizarVeiculo", outroVeiculo);
        }
      } catch (e) {
        console.error(e);
      }

      await carregarDadosFirebase();
      recalcularEstadoOperacional();
      saveAppState();
      closeModal();
      render();
      showToast(`Veículo ${id} criado com estoque individual.`);
    };

    window.alterarStatusVeiculo = async (id) => {
      const v = appState.vehicles.find(veh => veh.id === id); if (!v) return;
      v.status = v.status === "OK" ? "Atenção" : "OK"; saveAppState(); render(); await api("atualizarVeiculo", v);
    };

    window.editarVeiculo = async (id) => {
      const v = appState.vehicles.find(veh => veh.id === id);
      if (!v) return;

      // Garante que a lista de usuários está carregada
      if (!(appState.usuarios || []).length) {
        try { await carregarUsuariosAdm(); } catch (e) { console.error(e); }
      }

      const tecnicos = (appState.usuarios || [])
        .filter(u2 => String(u2.status || "Ativo").toLowerCase() === "ativo")
        .map(u2 => {
          const nomeT = String(u2.nome || u2.usuario || "").replace(/"/g, "&quot;");
          const sel = String(u2.nome || "") === String(v.tecnico || "") ? "selected" : "";
          return `<option value="${nomeT}" ${sel}>${u2.nome || u2.usuario}</option>`;
        }).join("");

      const idSafe = String(v.id).replace(/'/g, "\\'");

      openModal(`
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h3 style="margin:0; font-size:17px;">✏️ Editar veículo — ${v.id}</h3>
      <button class="btn-action btn-outline" style="min-height:32px; padding:0 10px; color:#000 !important;" onclick="closeModal()">✕</button>
    </div>
    <div class="form-group"><label>Veículo</label><input class="form-control" value="${v.id}" disabled style="opacity:0.7;"></div>
    <div class="form-group"><label>Placa</label><input id="editVeiPlaca" class="form-control" value="${v.placa || ""}" placeholder="Ex.: JKL-9D12"></div>
    <div class="form-group">
      <label>Técnico responsável</label>
      <select id="editVeiTecnico" class="form-control">
        <option value="">— Sem técnico —</option>
        ${tecnicos}
      </select>
    </div>
    <div class="form-group"><label>Odômetro (km)</label><input id="editVeiKm" type="number" class="form-control" value="${v.km || 0}"></div>
    <div class="form-group">
      <label>Status</label>
      <select id="editVeiStatus" class="form-control">
        <option value="OK" ${v.status === "OK" ? "selected" : ""}>OK</option>
        <option value="Atenção" ${v.status === "Atenção" ? "selected" : ""}>Atenção</option>
      </select>
    </div>
    <button id="btnSalvarVeiculo" class="btn-action btn-primary btn-full" onclick="salvarEdicaoVeiculo('${idSafe}')">Salvar alterações</button>
  `);
    };

    window.salvarEdicaoVeiculo = async (idOriginal) => {
      const v = appState.vehicles.find(veh => veh.id === idOriginal);
      if (!v) return;

      const placa = String(document.getElementById("editVeiPlaca")?.value || "").trim() || "---";
      const tecnico = String(document.getElementById("editVeiTecnico")?.value || "").trim();
      const km = Number(document.getElementById("editVeiKm")?.value || 0);
      const status = String(document.getElementById("editVeiStatus")?.value || "OK");

      if (km < (Number(v.km) || 0)) {
        return showSystemAlert(`O odômetro não pode ficar menor que o atual (${v.km.toLocaleString('pt-BR')} km).`);
      }

      // Verifica se o técnico escolhido já está associado a OUTRO veículo
      let outroVeiculo = null;
      if (tecnico) {
        outroVeiculo = (appState.vehicles || []).find(veh =>
          String(veh.tecnico || "").trim() === tecnico &&
          String(veh.id) !== String(idOriginal)
        );
        if (outroVeiculo) {
          const confirmou = await new Promise((resolve) => {
            openModal(`
        <div style="margin-bottom:14px;">
          <h3 style="margin:0 0 8px; font-size:17px;">⚠️ Técnico já associado</h3>
          <div style="font-size:13px; line-height:1.6;">
            O técnico <strong>${tecnico}</strong> já está associado ao veículo
            <strong>${outroVeiculo.id}</strong>.<br><br>
            Deseja alterar a associação para <strong>${v.id}</strong>?
          </div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn-action btn-outline" style="flex:1;" onclick="closeModal(); window.__resTecVeic(false);">Não, cancelar</button>
          <button class="btn-action btn-primary" style="flex:1;" onclick="closeModal(); window.__resTecVeic(true);">Sim, alterar associação</button>
        </div>`);
            window.__resTecVeic = (r) => resolve(r);
          });
          if (!confirmou) return; // admin cancelou — nada é alterado
        }
      }

      const tecnicoAntigo = String(v.tecnico || "").trim();

      try {
        v.placa = placa;
        v.tecnico = tecnico;
        v.km = km;
        v.status = status === "Atenção" ? "Atenção" : "OK";

        await api("atualizarVeiculo", v);

        const { db, doc, setDoc } = fbFns();
        const agora = new Date().toISOString();

        // 1) O técnico anterior deste veículo perde a associação no usuário
        if (tecnicoAntigo && tecnicoAntigo !== tecnico) {
          const antigo = (appState.usuarios || []).find(u2 =>
            String(u2.nome || "").trim() === tecnicoAntigo &&
            String(u2.veiculo || "").trim() === String(v.id)
          );
          if (antigo) {
            await setDoc(doc(db, "usuarios", String(antigo.id || antigo.usuario)), {
              veiculo: "",
              atualizadoEm: agora
            }, { merge: true });
            antigo.veiculo = "";
          }
        }

        // 2) O técnico novo recebe este veículo no usuário
        if (tecnico) {
          const novo = (appState.usuarios || []).find(u2 =>
            String(u2.nome || "").trim() === tecnico
          );
          if (novo && String(novo.veiculo || "").trim() !== String(v.id)) {
            await setDoc(doc(db, "usuarios", String(novo.id || novo.usuario)), {
              veiculo: String(v.id),
              atualizadoEm: agora
            }, { merge: true });
            novo.veiculo = String(v.id);
          }
        }

        // 3) Se o técnico estava em OUTRO veículo, desvincula lá (o veículo fica sem técnico)
        if (outroVeiculo) {
          outroVeiculo.tecnico = "";
          await api("atualizarVeiculo", outroVeiculo);
        }

        saveAppState();
        closeModal();
        recalcularEstadoOperacional();
        render();
        showToast(`Veículo ${v.id} atualizado.`);
      } catch (e) {
        console.error(e);
        showSystemAlert("Não foi possível salvar o veículo: " + (e.message || e));
      }
    };

    window.excluirVeiculo = async (id) => {
      const v = appState.vehicles.find(veh => veh.id === id);
      if (!v) return;
      const idSafe = String(id).replace(/'/g, "\\'");
      openModal(`
    <div style="margin-bottom:14px;">
      <h3 style="margin:0 0 8px; font-size:17px;">🗑️ Excluir veículo</h3>
      <div style="font-size:13px; line-height:1.6;">
        Deseja excluir o veículo <strong>${v.id}</strong> (${v.placa || "sem placa"})?<br><br>
        ⚠️ Essa ação não pode ser desfeita.
      </div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn-action btn-outline" style="flex:1;" onclick="closeModal()">Cancelar</button>
      <button class="btn-action btn-primary" style="flex:1; background:#f87171; border-color:#f87171;" onclick="confirmarExclusaoVeiculo('${idSafe}')">Excluir</button>
    </div>
  `);
    };

    window.confirmarExclusaoVeiculo = async (id) => {
      await api("excluirVeiculo", { id });
      await carregarDadosFirebase();
      recalcularEstadoOperacional();
      saveAppState();
      closeModal();
      render();
      showToast(`Veículo ${id} excluído.`);
    };

    // ===== Histórico de OS — helpers (lista + busca) =====
    const stNormalOS = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

    window.historicoOSFiltrado = (termo = "") => {
      const q = String(termo || "").trim().toLowerCase();
      return (appState.allOS || [])
        .filter(o => ["concluida", "concluido", "finalizada", "finalizado"].includes(stNormalOS(o.status)))
        .filter(o => {
          if (!q) return true;
          const alvo = [o.id, o.numero_os, o.cliente, o.tecnico, o.agendamentoData, o.planejamento?.periodos?.[0]?.data, o.atividade]
            .map(x => String(x || "").toLowerCase()).join(" ");
          return alvo.includes(q);
        })
        .sort((a, b) => String(b.agendamentoData || b.planejamento?.periodos?.[0]?.data || "")
          .localeCompare(String(a.agendamentoData || a.planejamento?.periodos?.[0]?.data || "")));
    };

    window.htmlListaHistoricoOS = (lista) => lista.length ? lista.map(o => {
      const data = o.agendamentoData || o.planejamento?.periodos?.[0]?.data || "";
      const dataBR = data ? new Date(data + "T12:00:00").toLocaleDateString("pt-BR") : "—";
      const safeId = String(o.id || o.numero_os || "").replace(/'/g, "\\'");
      const cor = typeof window.corTecnicoAgenda === "function" ? window.corTecnicoAgenda(o.tecnico) : "#38bdf8";
      return `
        <div onclick="abrirDetalhesOSFechadaAdm('${safeId}')" style="background:var(--surface-alt); border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-bottom:6px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px;" onmouseover="this.style.borderColor='#38bdf8'" onmouseout="this.style.borderColor='var(--border)'">
          <div style="min-width:0;">
            <strong style="font-size:12px; color:#38bdf8;">${escHtml(o.id || o.numero_os)}</strong>
            <div style="font-size:11px; color:#cbd5e1;">${escHtml(o.cliente || "Cliente não informado")}</div>
          </div>
          <div style="text-align:right; flex-shrink:0;">
            <span style="font-size:10px; color:var(--text-muted);">📅 ${dataBR}</span>
            <div style="font-size:11px; color:${cor}; font-weight:600;">● ${escHtml(o.tecnico || "Sem técnico")}</div>
          </div>
        </div>`;
    }).join("")
      : `<div style="padding:14px; text-align:center; color:var(--text-muted); font-size:12px; border:1px dashed var(--border); border-radius:10px;">Nenhuma OS encontrada.</div>`;

    window.filtrarHistoricoOS = () => {
      const box = document.getElementById("listaHistoricoOS");
      if (!box) return;
      box.innerHTML = window.htmlListaHistoricoOS(window.historicoOSFiltrado(document.getElementById("buscaHistoricoOS")?.value || ""));
    };


    // ===== Controle gerencial mensal (visão geral) =====
    function chaveMesControle(valor) {
      const s = String(valor || "").trim();
      if (!s) return "";
      const iso = s.match(/^(\d{4})-(\d{2})/);
      if (iso) return `${iso[1]}-${iso[2]}`;
      const br = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
      if (br) return `${br[3]}-${br[2]}`;
      const d = new Date(s);
      return Number.isNaN(d.getTime()) ? "" : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }

    function anoMesControle(valor) {
      return Number(chaveMesControle(valor).slice(0, 4)) || 0;
    }

    function htmlResumoControleMensal(mes, ano) {
      const chave = `${ano}-${String(mes).padStart(2, "0")}`;
      const os = Array.isArray(appState.allOS) ? appState.allOS : [];
      const problemas = Array.isArray(appState.problemsBase) ? appState.problemsBase : [];
      const osAbertasMes = os.filter(o => chaveMesControle(o.dataInclusao) === chave);
      const osConcluidasMes = os.filter(o => osEstaFinalizada(o) && chaveMesControle(o.fim || o.dataConclusao || o.data_conclusao || o.atualizadoEm || o.dataInclusao) === chave);
      const ocorrenciasMes = problemas.filter(p => chaveMesControle(p.dataHora) === chave).length;
      const financeiroPrevisto = osAbertasMes.reduce((total, o) => total + num(o.previsaoFaturamento, 0), 0);
      const dinheiro = v => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
      const porTecnico = new Map();
      const garantir = nome => {
        const key = String(nome || "Sem técnico").trim() || "Sem técnico";
        if (!porTecnico.has(key)) porTecnico.set(key, { nome: key, atribuidas: 0, concluidas: 0 });
        return porTecnico.get(key);
      };
      osAbertasMes.forEach(o => { garantir(o.tecnico || o.usuarioTecnico).atribuidas += 1; });
      osConcluidasMes.forEach(o => { garantir(o.tecnico || o.usuarioTecnico).concluidas += 1; });
      const linhasTecnicos = [...porTecnico.values()].sort((a, b) => (b.atribuidas + b.concluidas) - (a.atribuidas + a.concluidas) || a.nome.localeCompare(b.nome, "pt-BR"));
      return `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:14px;">
          <div style="border:1px solid var(--border);border-radius:10px;padding:13px;background:var(--surface-alt);"><div style="font-size:11px;color:var(--text-muted);">OS cadastradas no mês</div><div style="font-size:25px;font-weight:800;margin-top:3px;">${osAbertasMes.length}</div></div>
          <div style="border:1px solid var(--border);border-radius:10px;padding:13px;background:var(--surface-alt);"><div style="font-size:11px;color:var(--text-muted);">OS concluídas no mês</div><div style="font-size:25px;font-weight:800;margin-top:3px;">${osConcluidasMes.length}</div></div>
          <div style="border:1px solid var(--border);border-radius:10px;padding:13px;background:var(--surface-alt);"><div style="font-size:11px;color:var(--text-muted);">Ocorrências registradas</div><div style="font-size:25px;font-weight:800;margin-top:3px;">${ocorrenciasMes}</div></div>
          <div style="border:1px solid var(--border);border-radius:10px;padding:13px;background:var(--surface-alt);"><div style="font-size:11px;color:var(--text-muted);">Previsão de faturamento</div><div style="font-size:21px;font-weight:800;margin-top:5px;">${dinheiro(financeiroPrevisto)}</div><div style="font-size:10px;color:var(--text-muted);margin-top:3px;">OS cadastradas no mês selecionado</div></div>
        </div>
        <div style="border:1px solid var(--border);border-radius:10px;overflow:hidden;">
          <div style="padding:11px 12px;border-bottom:1px solid var(--border);font-size:13px;font-weight:800;">👷 Volume de OS por técnico</div>
          ${linhasTecnicos.length ? `<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12px;min-width:300px;"><thead><tr style="text-align:left;background:var(--surface-alt);"><th style="padding:9px 12px;">Técnico</th><th style="padding:9px 12px;text-align:center;">Atribuídas*</th><th style="padding:9px 12px;text-align:center;">Concluídas</th></tr></thead><tbody>${linhasTecnicos.map(t => `<tr style="border-top:1px solid var(--border);"><td style="padding:9px 12px;">${escHtml(t.nome)}</td><td style="padding:9px 12px;text-align:center;">${t.atribuidas}</td><td style="padding:9px 12px;text-align:center;">${t.concluidas}</td></tr>`).join("")}</tbody></table></div>` : `<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:12px;">Nenhuma OS encontrada para os técnicos neste mês.</div>`}
          <div style="padding:8px 12px;font-size:10px;color:var(--text-muted);">*OS cadastradas no mês com técnico informado. A previsão financeira soma o campo de previsão de faturamento dessas OS.</div>
        </div>`;
    }

    function htmlControleMensal() {
      const agora = new Date();
      const mesAtual = agora.getMonth() + 1;
      const anoAtual = agora.getFullYear();
      const anos = new Set([anoAtual]);
      (appState.allOS || []).forEach(o => {
        [o.dataInclusao, o.fim, o.dataConclusao, o.atualizadoEm].forEach(d => { const a = anoMesControle(d); if (a) anos.add(a); });
      });
      (appState.problemsBase || []).forEach(p => { const a = anoMesControle(p.dataHora); if (a) anos.add(a); });
      const meses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
      return `
        <div class="card-box" id="cardControleMensal" style="margin-top:12px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
            <div><div style="font-size:11px;text-transform:uppercase;color:#38bdf8;font-weight:800;">Indicadores</div><h3 style="margin:2px 0 0;font-size:16px;">📊 Controle Gerencial Mensal</h3><div style="font-size:11px;color:var(--text-muted);margin-top:3px;">Resumo geral de OS, técnicos, ocorrências e previsão financeira.</div></div>
            <div style="display:flex;gap:7px;flex-wrap:wrap;">
              <select id="controleMensalMes" class="form-control" style="min-width:130px;min-height:34px;font-size:12px;" onchange="atualizarControleMensal()">${meses.map((m,i) => `<option value="${i+1}" ${i+1===mesAtual?'selected':''}>${m}</option>`).join("")}</select>
              <select id="controleMensalAno" class="form-control" style="min-width:90px;min-height:34px;font-size:12px;" onchange="atualizarControleMensal()">${[...anos].sort((a,b)=>b-a).map(a => `<option value="${a}" ${a===anoAtual?'selected':''}>${a}</option>`).join("")}</select>
            </div>
          </div>
          <div id="controleMensalResumo">${htmlResumoControleMensal(mesAtual, anoAtual)}</div>
        </div>`;
    }

    window.atualizarControleMensal = () => {
      const mes = Number(document.getElementById("controleMensalMes")?.value || new Date().getMonth() + 1);
      const ano = Number(document.getElementById("controleMensalAno")?.value || new Date().getFullYear());
      const alvo = document.getElementById("controleMensalResumo");
      if (alvo) alvo.innerHTML = htmlResumoControleMensal(mes, ano);
    };

    // Corrige uma única vez a configuração antiga de Instalação, que pode ter sido
    // salva parcialmente antes de o catálogo completo estar disponível. O marcador
    // impede que itens excluídos posteriormente pelo administrador reapareçam.
    let migracaoInstalacaoPromise = null;
    async function garantirCatalogoCompletoInstalacao() {
      if (appState.role !== "ADM") return;
      if (migracaoInstalacaoPromise) return migracaoInstalacaoPromise;
      migracaoInstalacaoPromise = (async () => {
        const { db, doc, getDoc, setDoc } = fbFns();
        const marcador = doc(db, "catalogo_checklist_atividade", "__migracao_instalacao_catalogo_completo_v1");
        const snapMarcador = await getDoc(marcador);
        if (snapMarcador.exists()) return;

        const nomeCatalogoInicial = x => String(typeof x === "string" ? x : (x?.nome || x?.item || x?.ferramenta || x?.material || x?.descricao || x?.nomeMaterial || x?.nomeFerramenta || "")).trim();
        const ferramentas = [...new Set((appState.toolList || []).map(nomeCatalogoInicial).filter(Boolean))];
        const materiais = [...new Set((appState.allMaterials || []).map(nomeCatalogoInicial).filter(Boolean))];
        const atuais = appState.activityCatalog?.["Instalação"] || { ferramentas: [], materiais: [] };
        for (const item of ferramentas) {
          if (!(atuais.ferramentas || []).includes(item)) {
            await api("atualizarCatalogoAtividade", { atividade: "Instalação", tipo: "ferramenta", item, operacao: "incluir" });
          }
        }
        for (const item of materiais) {
          if (!(atuais.materiais || []).includes(item)) {
            await api("atualizarCatalogoAtividade", { atividade: "Instalação", tipo: "material", item, operacao: "incluir" });
          }
        }
        await setDoc(marcador, { migracao: "instalacao_catalogo_completo_v1", concluidaEm: new Date().toISOString() });
        await carregarDadosFirebase();
        render();
      })().catch(e => {
        migracaoInstalacaoPromise = null;
        console.warn("Não foi possível completar o catálogo inicial de Instalação:", e);
      });
      return migracaoInstalacaoPromise;
    }

    function renderAdmAtividades(c) {
      const atividades = ["Instalação", "Higienização", "Manutenção", "Outros"];
      const pendentes = (appState.solicitacoesChecklistAtividade || []).filter(x => String(x.status || "Pendente") === "Pendente");
      const cardSolicitacao = sol => `
        <div class="card-box" style="margin-top:10px;border-left:3px solid #f59e0b;">
          <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;">
            <strong>${escHtml(sol.atividade || "Atividade")} • ${escHtml(sol.item || "Item")}</strong>
            <span class="status-pill" style="background:rgba(245,158,11,.15);color:#f59e0b;">Pendente</span>
          </div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:6px;">Solicitante: ${escHtml(sol.solicitante || "Técnico")} • ${escHtml(sol.tipo || "")}</div>
          <div style="font-size:12px;margin-top:6px;">Alteração: <strong>${escHtml(({incluir:"Incluir item",excluir:"Excluir item",quantidade:"Alterar quantidade"})[sol.operacao] || sol.operacao || "-" )}</strong>${sol.operacao === "quantidade" || sol.operacao === "incluir" ? ` • Quantidade: ${Number(sol.quantidade || 1)}` : ""}</div>
          <div style="font-size:12px;margin-top:5px;">Justificativa: ${escHtml(sol.justificativa || "Não informada")}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;">
            <button class="btn-action btn-primary" onclick="decidirSolicitacaoChecklist('${String(sol.id).replace(/'/g,"\\'")}', 'Aprovada')">✓ Aprovar</button>
            <button class="btn-action btn-outline" onclick="decidirSolicitacaoChecklist('${String(sol.id).replace(/'/g,"\\'")}', 'Rejeitada')">✕ Rejeitar</button>
          </div>
        </div>`;
      const nomeCatalogo = x => String(typeof x === "string" ? x : (x?.nome || x?.item || x?.ferramenta || x?.material || x?.descricao || x?.nomeMaterial || x?.nomeFerramenta || "")).trim();
      const todasFerramentas = [...new Set((appState.toolList || []).map(nomeCatalogo).filter(Boolean))];
      const todosMateriais = [...new Set((appState.allMaterials || []).map(nomeCatalogo).filter(Boolean))];
      const bloco = atividade => {
        const dados = appState.activityCatalog?.[atividade] || { ferramentas: [], materiais: [], quantidades: {} };
        // Se já existe um padrão salvo para a atividade, respeita exatamente essa relação
        // para que exclusões aprovadas pelo administrador não reapareçam automaticamente.
        // Se ainda não existe configuração, mostra o catálogo completo como padrão inicial.
        const configurada = (dados.ferramentas || []).length > 0 || (dados.materiais || []).length > 0;
        const ferramentasAtividade = [...new Set((configurada ? dados.ferramentas : todasFerramentas).map(nomeCatalogo).filter(Boolean))];
        const materiaisAtividade = [...new Set((configurada ? dados.materiais : todosMateriais).map(nomeCatalogo).filter(Boolean))];
        const listaItens = [...ferramentasAtividade.map(item => ({item,tipo:"ferramenta"})), ...materiaisAtividade.map(item => ({item,tipo:"material"}))];
        const opcoesFerramentas = todasFerramentas.map(x => `<option value="${escHtml(x)}">${escHtml(x)}</option>`).join("");
        const opcoesMateriais = todosMateriais.map(x => `<option value="${escHtml(x)}">${escHtml(x)}</option>`).join("");
        const idSafe = atividade.replace(/[^a-zA-Z0-9]/g, "_");
        return `<div class="card-box" style="margin-top:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
            <h3 style="margin:0;font-size:15px;">${escHtml(atividade)}</h3>
            <span style="font-size:11px;color:var(--text-muted);">${ferramentasAtividade.length} ferramentas • ${materiaisAtividade.length} materiais</span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:10px;">
            <div><label style="font-size:11px;">Adicionar ferramenta</label><div style="display:flex;gap:6px;"><input id="atividadeFerramenta_${atividade}" list="listaFerramentasAtividade_${idSafe}" class="form-control" placeholder="Digite ou selecione" style="min-width:0;"><datalist id="listaFerramentasAtividade_${idSafe}">${opcoesFerramentas}</datalist><button class="btn-action btn-primary" onclick="adicionarItemCatalogoAtividade('${atividade}','ferramenta')">＋</button></div></div>
            <div><label style="font-size:11px;">Adicionar material</label><div style="display:flex;gap:6px;"><input id="atividadeMaterial_${atividade}" list="listaMateriaisAtividade_${idSafe}" class="form-control" placeholder="Digite ou selecione" style="min-width:0;"><datalist id="listaMateriaisAtividade_${idSafe}">${opcoesMateriais}</datalist><button class="btn-action btn-primary" onclick="adicionarItemCatalogoAtividade('${atividade}','material')">＋</button></div></div>
          </div>
          <p style="font-size:10px;color:var(--text-muted);margin:6px 0 0;">O administrador pode incluir diretamente um item nesta atividade ou removê-lo do padrão compartilhado. Isso não altera checklists de OS já executadas.</p>
          ${listaItens.length ? `<div style="display:flex;flex-direction:column;gap:6px;margin-top:10px;">${listaItens.map(x=>{
            const q = dados.quantidades?.[`${x.tipo}:${x.item}`];
            return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface-alt);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:12px;"><span>${x.tipo === "ferramenta" ? "🔧" : "📦"} ${escHtml(x.item)} <span style="color:var(--text-muted);">• Qtd. padrão: ${Number(q || 1)}</span></span><button class="btn-action btn-outline" style="min-height:28px;padding:3px 8px;font-size:11px;" onclick="removerItemCatalogoAtividade('${atividade}','${x.tipo}',decodeURIComponent('${encodeURIComponent(String(x.item))}'))">Excluir</button></div>`;
          }).join("")}</div>` : `<p style="font-size:12px;color:var(--text-muted);margin:10px 0 0;">Nenhum item aprovado para esta atividade.</p>`}
        </div>`;
      };
      const todos = (appState.solicitacoesChecklistAtividade || []).filter(x => String(x.status || "") !== "Pendente").slice().sort((a,b)=>String(b.analisadoEm||"").localeCompare(String(a.analisadoEm||""))).slice(0,8);
      c.innerHTML = `
        <div class="card-box" id="cardHistoricoOS" style="margin-top:12px;">
          <h3 style="margin:0;font-size:16px;">📚 Histórico de OS Concluídas</h3>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">Consulte e pesquise ordens de serviço finalizadas.</div>
          <input id="buscaHistoricoOS" class="form-control" style="margin:10px 0;" placeholder="Buscar por OS, cliente, técnico ou atividade..." oninput="filtrarHistoricoOS()">
          <div id="listaHistoricoOS">${window.htmlListaHistoricoOS(window.historicoOSFiltrado(""))}</div>
        </div>
        ${htmlControleMensal()}
        <div class="card-box">
          <div style="font-size:11px;text-transform:uppercase;color:#38bdf8;font-weight:800;">Governança do checklist</div>
          <h2 style="margin:2px 0 0;font-size:19px;">📋 Checklist por atividade</h2>
          <p style="font-size:12px;color:var(--text-muted);margin-bottom:0;">Os técnicos podem sugerir alterações. Somente após aprovação do administrador a mudança entra no padrão compartilhado por todos.</p>
        </div>
        <div class="card-box" style="margin-top:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;"><h3 style="margin:0;font-size:16px;">⏳ Solicitações pendentes</h3><span class="status-pill" style="background:rgba(245,158,11,.15);color:#f59e0b;">${pendentes.length}</span></div>
          ${pendentes.length ? pendentes.map(cardSolicitacao).join("") : `<p style="font-size:12px;color:var(--text-muted);margin-bottom:0;">Nenhuma solicitação aguardando aprovação.</p>`}
          <button class="btn-action btn-outline btn-full" style="margin-top:10px;" onclick="atualizarSolicitacoesChecklist()">↻ Atualizar solicitações</button>
        </div>
        <div class="card-box" style="margin-top:16px;border-top:3px solid #38bdf8;">
          <div style="font-size:11px;text-transform:uppercase;color:#38bdf8;font-weight:800;">Catálogo e padronização</div>
          <h2 style="margin:2px 0 0;font-size:19px;">📚 Catálogo de ferramentas e materiais por atividade</h2>
          <p style="font-size:12px;color:var(--text-muted);margin-bottom:0;">A relação inicial de cada atividade inclui todas as ferramentas e materiais cadastrados. O cliente poderá ajustar o padrão por meio das sugestões dos técnicos e aprovação do administrador.</p>
        </div>

      const payload = { tipo: "backup_os", versao: 1, geradoEm: new Date().toISOString(), total: lista.length, os: lista };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `backup_os_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); a.remove();

          const txt = await file.text();
          const data = JSON.parse(txt);
          const lista = Array.isArray(data) ? data : (Array.isArray(data.os) ? data.os : null);

    window.limparHistoricoOS = async () => {
      const dataLimite = String(document.getElementById("limparOSData")?.value || "").trim();
      const confirma = String(document.getElementById("limparOSConfirma")?.value || "").trim().toUpperCase();
      if (confirma !== "LIMPAR") { showSystemAlert("Digite LIMPAR para confirmar.", "Confirmação"); return; }
      if (!dataLimite) { showSystemAlert("Informe a data limite.", "Confirmação"); return; }

      const stNorm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const ehFechada = (o) => ["concluida", "concluido", "finalizada", "finalizado", "cancelada", "cancelado"].includes(stNorm(o.status));

      const alvos = (appState.allOS || []).filter(o => {
        const d = rotuloDataOSBackup(o);
        return d && d <= dataLimite && ehFechada(o);   
      });
      if (!alvos.length) { showSystemAlert("Nenhuma OS concluída encontrada até essa data.", "Limpeza"); return; }
      const preservadas = (appState.allOS || []).filter(o => !alvos.includes(o)).length;

      });

window.marcarProblemaTratado = async (id) => {
  const problema = (appState.problemsBase || []).find(
    p => String(p.id) === String(id)
  ) || (appState.problems || []).find(
    p => String(p.id) === String(id)
  );

  if (!problema) {
    showToast("Problema não encontrado.", "#ef4444");
    return;
  }

  try {
    const { db, doc, setDoc, deleteDoc } = fbFns();
    const agora = new Date().toISOString();

    // Identifica o técnico que reportou a ocorrência.
    const tecnico = String(problema.tecnico || "").trim();

    if (!tecnico) {
      throw new Error(
        "Não foi possível identificar o técnico que reportou o problema."
      );
    }

    // 1. Registra a notificação antes de excluir a ocorrência.
    // O ID determinístico evita criar várias notificações
    // para a mesma ocorrência em caso de nova tentativa.
    const notificacao = {
      id: `notif-problema-resolvido-${String(id)}`,
      destinatario: tecnico,
      tipo: "ProblemaResolvido",
      titulo: "Ocorrência resolvida",
      mensagem:
        `A ocorrência "${problema.tipo}" foi resolvida pela Central ADM. ` +
        `Descrição: ${problema.descricao}`,
      problemaId: String(id),
      lida: false,
      data: agora,
      criadoEm: agora
    };

    await setDoc(
      doc(db, "notificacoes", notificacao.id),
      notificacao,
      { merge: true }
    );

    // 2. Exclui definitivamente o documento da base operacional.
    await deleteDoc(doc(db, "problemas", String(id)));

    // 3. Atualiza as listas locais para impedir que reapareça na tela.
    appState.problemsBase = (appState.problemsBase || []).filter(
      p => String(p.id) !== String(id)
    );

    appState.problems = (appState.problems || []).filter(
      p => String(p.id) !== String(id)
    );

    // 4. Atualiza as notificações locais.
    appState.notificationsBase = [
      ...(appState.notificationsBase || []).filter(
        n => String(n.id) !== String(notificacao.id)
      ),
      notificacao
    ];

    appState.notifications = [
      ...(appState.notifications || []).filter(
        n => String(n.id) !== String(notificacao.id)
      ),
      notificacao
    ];

    // 5. Atualiza a interface.
    saveAppState();
    render();

    showToast("Ocorrência resolvida e técnico notificado!");

  } catch (error) {
    console.error("Erro ao resolver ocorrência:", error);

    showToast(
      "Falha ao resolver ou notificar. Verifique a conexão e tente novamente.",
      "#ef4444"
    );
  }
};

  <script>
    /* Skip artifact shell — fixed helpers served beside every artifact. */
    (function () {
      "use strict";

      var fmt = {
        num: function (v, opts) { return new Intl.NumberFormat("pt-BR", opts || {}).format(v); },
        brl: function (v) { return new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(v); },
        pct: function (v) { return new Intl.NumberFormat("pt-BR", { style: "percent", maximumFractionDigits: 1 }).format(v); }
      };

      // axisFmt keeps axis tick labels short (compact notation) so long values
      // (e.g. full BRL amounts) never clip against the plot edge.
      function axisFmt(v) {
        return fmt.num(v, { notation: "compact", maximumFractionDigits: 1 });
      }

      // format accepts a function OR one of the fmt names ("num" | "brl" | "pct").
      function coerceFormat(spec) {
        if (typeof spec === "function") return spec;
        if (typeof spec === "string" && fmt[spec]) return fmt[spec];
        return function (v) { return fmt.num(v); };
      }

      function accent() {

      function maxOf(values) {

        return m > 0 ? m : 1;
      }

          var lbl = svgEl("text", { x: padL - 8, y: gy + 4, "text-anchor": "end", "font-size": 10, fill: mutedColor() });
          lbl.textContent = axisFmt((max * g) / 4);

          r.appendChild(t);
          svg.appendChild(r);
          var tx = svgEl("text", { x: x + bw / 2, y: H - 10, "text-anchor": "middle", "font-size": 11, fill: mutedColor() });
          tx.textContent = cfg.labels[i];
          svg.appendChild(tx);
        });
      }

      // line(el, {labels:[], values:[], color?, format?}) — single-series line.
      function line(el, cfg) {
        var W = 640, H = 280, padL = 46, padB = 30, padT = 12;
        var svg = frame(el, W, H);
        var max = maxOf(cfg.values);
        var n = cfg.values.length;
        var plotW = W - padL - 16, plotH = H - padT - padB;
        var color = cfg.color || accent();
        var f = coerceFormat(cfg.format);
        for (var g = 0; g <= 4; g++) {
          var gy = padT + plotH - (plotH * g) / 4;
          svg.appendChild(svgEl("line", { x1: padL, y1: gy, x2: W - 16, y2: gy, stroke: "currentColor", "stroke-opacity": 0.08 }));
          var lbl = svgEl("text", { x: padL - 8, y: gy + 4, "text-anchor": "end", "font-size": 10, fill: mutedColor() });
          lbl.textContent = axisFmt((max * g) / 4);
          svg.appendChild(lbl);
        }
        var pts = cfg.values.map(function (v, i) {
          var x = padL + (n === 1 ? plotW / 2 : (plotW * i) / (n - 1));
          var y = padT + plotH - (v / max) * plotH;
          return [x, y];
        });
        var d = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
        svg.appendChild(svgEl("path", { d: d, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round" }));
        pts.forEach(function (p, i) {
          var c = svgEl("circle", { cx: p[0], cy: p[1], r: 3.5, fill: color });
          var t = svgEl("title", {});
          t.textContent = cfg.labels[i] + ": " + f(cfg.values[i]);
          c.appendChild(t);
          svg.appendChild(c);
          var tx = svgEl("text", { x: p[0], y: H - 10, "text-anchor": "middle", "font-size": 11, fill: mutedColor() });
          tx.textContent = cfg.labels[i];
          svg.appendChild(tx);
        });
      }

      // donut(el, {labels:[], values:[], colors?}) — donut with center total.
      function donut(el, cfg) {
        var W = 320, H = 280, cx = W / 2, cy = H / 2, R = 92, r = 58;
        var svg = frame(el, W, H);
        var total = cfg.values.reduce(function (a, b) { return a + b; }, 0) || 1;
        var palette = cfg.colors || [accent(), "#1baf7a", "#eda100", "#e34948", "#4a3aa7", "#e87ba4"];
        var a0 = -Math.PI / 2;
        cfg.values.forEach(function (v, i) {
          var a1 = a0 + (v / total) * Math.PI * 2;
          var large = a1 - a0 > Math.PI ? 1 : 0;
          var p = ["M", cx + R * Math.cos(a0), cy + R * Math.sin(a0),
            "A", R, R, 0, large, 1, cx + R * Math.cos(a1), cy + R * Math.sin(a1),
            "L", cx + r * Math.cos(a1), cy + r * Math.sin(a1),
            "A", r, r, 0, large, 0, cx + r * Math.cos(a0), cy + r * Math.sin(a0), "Z"].join(" ");
          var path = svgEl("path", { d: p, fill: palette[i % palette.length] });
          var t = svgEl("title", {});
          t.textContent = cfg.labels[i] + ": " + fmt.num(v) + " (" + fmt.pct(v / total) + ")";
          path.appendChild(t);
          svg.appendChild(path);
          a0 = a1;
        });
        var center = svgEl("text", { x: cx, y: cy + 5, "text-anchor": "middle", "font-size": 20, "font-weight": 650, fill: "currentColor" });
        center.textContent = fmt.num(total);
        svg.appendChild(center);
      }

      window.skipShell = { fmt: fmt };
      window.skipChart = { bar: bar, line: line, donut: donut };
    })();

    function escHtml(v) {
      return String(v ?? "").replace(/[&<>\"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '\"': "&quot;", "'": "&#39;" }[c]));

        return d || String(a.nome || "").localeCompare(String(b.nome || ""), "pt-BR");
      });

    window.salvarEntradaMaterial = async (id) => {
      const qtd = Number(document.getElementById("entradaMaterialQtd")?.value);
      const origem = document.getElementById("entradaMaterialOrigem")?.value || "estoque";
      if (!Number.isFinite(qtd) || qtd <= 0) { showSystemAlert("Informe uma quantidade válida.", "Entrada de material"); return; }
      const mat = (appState.materials || []).find(m => String(m.id) === String(id));
      if (!mat) return;
      try {
        const { db, doc, runTransaction, addDoc, collection } = fbFns();
        const materialId = String(mat.materialId || mat.catalogoId || mat.id);
        const vehicleRef = doc(db, "materiais", String(mat.id));
        const centralRef = doc(db, "estoque_central", materialId);
        const agora = new Date().toISOString();
        let novoSaldoVeiculo = 0;
        await runTransaction(db, async (tx) => {
          const vehicleSnap = await tx.get(vehicleRef);
          if (!vehicleSnap.exists()) throw new Error("O registro do material no veículo não foi encontrado.");
          const saldoVeiculo = Number(vehicleSnap.data().saldo || 0);
          let saldoCentral = 0;
          if (origem === "estoque") {
            const centralSnap = await tx.get(centralRef);
            if (!centralSnap.exists()) throw new Error("Material não localizado no estoque interno. Sincronize o estoque antes de continuar.");
            saldoCentral = Number(centralSnap.data().saldo || 0);
            if (saldoCentral < qtd) throw new Error(`Estoque interno insuficiente. Disponível: ${saldoCentral} ${mat.unidade || 'un'}.`);
            tx.update(centralRef, { saldo: Math.round((saldoCentral - qtd) * 100) / 100, atualizadoEm: agora });
          }
          novoSaldoVeiculo = Math.round((saldoVeiculo + qtd) * 100) / 100;
          tx.update(vehicleRef, { saldo: novoSaldoVeiculo, atualizadoEm: agora });
        });
        await addDoc(collection(db, "movimentacoes"), {
          tipo: origem === "estoque" ? "Transferência do estoque central para veículo" : "Entrada externa no veículo",
          materialId, stockId: mat.id, material: mat.nome, quantidade: qtd, unidade: mat.unidade || "un",
          saldoVeiculoNovo: novoSaldoVeiculo, veiculo: appState.veiculo, tecnico: appState.tecnico,
          origem: origem === "estoque" ? "transferencia_estoque_central" : "entrada_externa_veiculo",
          dataHora: agora, usuario: appState.usuario?.usuario || appState.tecnico || ""
        });
        if (origem === "externo") {
          await notificarAdministradores(
            "Entrada externa de material — ciência do administrador",
            `${appState.tecnico || appState.usuario?.usuario || "Técnico"} registrou entrada externa de ${qtd} ${mat.unidade || "un"} de ${mat.nome} para o veículo ${appState.veiculo || "não informado"}. O estoque interno não foi alterado. Saldo atualizado no veículo: ${novoSaldoVeiculo} ${mat.unidade || "un"}.`,
            "EntradaExternaMaterial"
          );
        }
        await carregarDadosFirebase();
        recalcularEstadoOperacional(); saveAppState();
        closeModal();
        showToast(origem === "estoque" ? `Transferidos ${qtd} ${mat.unidade || 'un'} do estoque interno.` : `Entrada externa registrada: +${qtd} ${mat.unidade || 'un'}`);
        render();
      } catch (e) {
        console.error("Falha na entrada de material:", e);
        showSystemAlert(e?.message || "Não foi possível registrar a entrada.", "Entrada de material");
      }
    };

            <div><strong>${escHtml(m.nome || m.material || "Material")}</strong><div style="font-size:11px;color:var(--text-muted);">Unidade: ${escHtml(m.unidade || "un")} • Mínimo: ${Number(m.min ?? m.nivel_minimo ?? 5).toLocaleString("pt-BR")}</div></div>
            <button class="btn-action btn-outline" style="min-height:30px;padding:3px 10px;" onclick="editarMaterialTecnico('${String(m.materialId || m.id || '').replace(/'/g, "\\'")}')">Editar</button>
          </div>`).join("") : `<div style="padding:25px;text-align:center;color:var(--text-muted);">Nenhum material cadastrado.</div>`}
      </div>
    `);
    };

    window.editarMaterialTecnico = async (materialId) => {
      const material = (appState.allMaterials || []).find(m => String(m.materialId || m.id || "") === String(materialId));
      if (!material) { showSystemAlert("Material não localizado.", "Editar material"); return; }
      const minAtual = Math.max(5, Number(material.min ?? material.nivel_minimo ?? 5));
      openModal(`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;"><h3 style="margin:0;font-size:17px;">✎ Editar material</h3><button class="btn-action btn-outline" style="min-height:32px;padding:0 10px;" onclick="abrirEdicaoMateriaisTecnico()">✕</button></div>
      <div class="form-group"><label>Nome do material *</label><input id="editMaterialNome" class="form-control" value="${escHtml(material.nome || material.material || "")}"></div>
      <div class="form-group"><label>Unidade *</label><input id="editMaterialUnidade" class="form-control" value="${escHtml(material.unidade || "un")}"></div>
      <div class="form-group"><label>Estoque mínimo *</label><input id="editMaterialMin" type="number" min="5" step="0.01" class="form-control" value="${minAtual}"></div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:-4px;">O estoque mínimo não pode ser inferior a 5 e será atualizado para os veículos.</div>
      <div style="display:flex;gap:8px;margin-top:14px;"><button class="btn-action btn-outline" style="flex:1;" onclick="abrirEdicaoMateriaisTecnico()">Cancelar</button><button class="btn-action btn-primary" style="flex:1;" onclick="salvarEdicaoMaterialTecnico('${String(material.materialId || material.id || '').replace(/'/g, "\\'")}')">Salvar</button></div>
    `);
    };

    window.salvarEdicaoMaterialTecnico = async (materialId) => {
      const nome = String(document.getElementById("editMaterialNome")?.value || "").trim();
      const unidade = String(document.getElementById("editMaterialUnidade")?.value || "un").trim() || "un";
      const min = Number(document.getElementById("editMaterialMin")?.value);
      if (!nome) { showSystemAlert("Informe o nome do material.", "Editar material"); return; }
      if (!Number.isFinite(min) || min < 5) { showSystemAlert("O estoque mínimo não pode ser inferior a 5.", "Editar material"); return; }

      const { db, doc, setDoc, getDocs, collection } = fbFns();
      const agora = new Date().toISOString();
      await setDoc(doc(db, "catalogo_materiais", materialId), { materialId, nome, material: nome, unidade, min, nivel_minimo: min, atualizadoEm: agora, atualizadoPor: appState.tecnico || appState.usuario?.usuario || "" }, { merge: true });

      const snap = await getDocs(collection(db, "materiais"));
      for (const d of snap.docs) {
        const x = d.data() || {};
        if (String(x.materialId || x.catalogoId || "") !== String(materialId)) continue;
        await setDoc(doc(db, "materiais", d.id), { nome, material: nome, unidade, min, nivel_minimo: min, atualizadoEm: agora }, { merge: true });
      }

      await carregarDadosFirebase();
      recalcularEstadoOperacional();
      saveAppState();
      closeModal();
      showToast("Material atualizado para os veículos.");
      render();
    };

    window.abrirHistoricoOSAntigas = () => {
      const base = appState.allOS.filter(o => {
        const pertence = normalizarChaveValor(o.veiculo) === normalizarChaveValor(appState.veiculo) ||
          normalizarChaveValor(o.tecnico) === normalizarChaveValor(appState.tecnico);
        return pertence && osEstaFinalizada(o) && !dataEhHoje(dataReferenciaOS(o));
      }).sort((a, b) => String(dataReferenciaOS(b)).localeCompare(String(dataReferenciaOS(a))));

      openModal(`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div><h3 style="margin:0;font-size:17px;">OS finalizadas anteriormente</h3><div style="font-size:11px;color:var(--text-muted);margin-top:3px;">${base.length} registro(s)</div></div>
        <button class="btn-action btn-outline" style="min-height:32px;padding:0 10px;" onclick="closeModal()">✕</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;max-height:65vh;overflow:auto;">
        ${base.length ? base.map(os => `
          <div style="background:var(--surface-alt);padding:11px;border-radius:10px;border:1px solid var(--border);">
            <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;">
              <div><strong style="color:#38bdf8;">${escHtml(os.id)}</strong><div style="font-size:13px;font-weight:700;margin-top:2px;">${escHtml(os.cliente || "")}</div></div>
              <span class="os-badge concluida">Concluída</span>
            </div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:6px;">${escHtml(dataReferenciaOS(os) || "Data não informada")}</div>
            <button class="btn-action btn-outline btn-full" style="margin-top:8px;" onclick="closeModal();verDetalhesOS('${String(os.id).replace(/'/g, "\'")}')">Ver detalhes</button>
          </div>`).join("") : `<div style="padding:25px;text-align:center;color:var(--text-muted);">Nenhuma OS finalizada anteriormente.</div>`}
      </div>
    `);
    };

    // Menu do Técnico: execução fica na Home; administração/cadastro fica aqui.
    function renderTecMenu(c) {
      const veicAtual = appState.veiculosAtual || appState.vehicles.find(v =>
        normalizarChaveValor(v.id || v.veiculo) === normalizarChaveValor(appState.veiculo)
      ) || {};

      const osDoVeiculo = (appState.allOS || []).filter(o =>
        normalizarChaveValor(o.veiculo) === normalizarChaveValor(appState.veiculo) ||
        normalizarChaveValor(o.tecnico) === normalizarChaveValor(appState.tecnico)
      );
      const osPendentes = osDoVeiculo.filter(o => !osEstaFinalizada(o)).length;
      const osConcluidasHoje = osDoVeiculo.filter(o => osEstaFinalizada(o) && dataEhHoje(dataReferenciaOS(o))).length;

      c.innerHTML = `
      <div class="card-box">
        <h3 style="margin:0 0 12px;font-size:15px;">🚐 Dados do veículo e motorista</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div style="background:var(--surface-alt);padding:10px;border-radius:8px;font-size:12px;">
            <div style="color:var(--text-muted);font-size:10px;text-transform:uppercase;">Veículo</div>
            <strong>${escHtml(appState.veiculo || veicAtual.id || "-")}</strong>
          </div>
          <div style="background:var(--surface-alt);padding:10px;border-radius:8px;font-size:12px;">
            <div style="color:var(--text-muted);font-size:10px;text-transform:uppercase;">Placa</div>
            <strong>${escHtml(appState.placa || extrairPlaca(veicAtual) || "-")}</strong>
          </div>
          <div style="background:var(--surface-alt);padding:10px;border-radius:8px;font-size:12px;">
            <div style="color:var(--text-muted);font-size:10px;text-transform:uppercase;">Motorista / Técnico</div>
            <strong>${escHtml(appState.tecnico || appState.usuario?.nome || veicAtual.tecnico || "-")}</strong>
          </div>
          <div style="background:var(--surface-alt);padding:10px;border-radius:8px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <div><div style="color:var(--text-muted);font-size:10px;text-transform:uppercase;">Quilometragem</div><strong>${Number(appState.km || veicAtual.km || 0).toLocaleString("pt-BR")} km</strong></div>
            <button class="btn-action btn-outline" style="min-height:30px;padding:2px 9px;" onclick="editarKm()">✎ Alterar</button>
          </div>
        </div>
      </div>

      <div class="card-box">
        <h3 style="margin:0 0 10px;font-size:15px;">Operação</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <button class="btn-action btn-outline" onclick="abrirChecklistVeiculo()">🚐 Checklist do veículo</button>
          <button class="btn-action btn-outline" onclick="abrirChecklistFerramentas()">🔧 Conferir ferramentas</button>
          <button class="btn-action btn-outline" onclick="abrirModalMateriais()">📦 Ver materiais</button>
          <button class="btn-action btn-outline" onclick="setTab('lista-os')">📋 Lista de OS</button>
        </div>
      </div>

      <div class="card-box">
        <h3 style="margin:0 0 10px;font-size:15px;">📋 Checklist por atividade</h3>
        <p style="font-size:12px;color:var(--text-muted);">Sugira inclusão ou exclusão de ferramentas e materiais, ou ajuste a quantidade padrão. O administrador precisa aprovar.</p>
        <button class="btn-action btn-primary btn-full" onclick="abrirSugestaoChecklist('Instalação')">＋ Sugerir alteração no checklist</button>
      </div>

      <div class="card-box">
        <h3 style="margin:0 0 10px;font-size:15px;">Cadastros</h3>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px;">O Técnico pode adicionar ferramentas e adicionar ou editar materiais. O estoque mínimo não pode ser inferior a 5.</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <button class="btn-action btn-primary" onclick="abrirCadastroFerramenta()">＋ Ferramenta</button>
          <button class="btn-action btn-primary" onclick="abrirCadastroMaterial()">＋ Material</button>
          <button class="btn-action btn-outline" style="grid-column:1/-1;" onclick="abrirEdicaoMateriaisTecnico()">✎ Editar materiais</button>
        </div>
      </div>

      <div class="card-box">
        <h3 style="margin:0 0 10px;font-size:15px;">Consultas</h3>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <div style="background:var(--surface-alt);padding:10px;border-radius:8px;font-size:12px;">🚐 Veículo: <strong>${escHtml(appState.veiculo || "-")}</strong> • Placa: <strong>${escHtml(appState.placa || "-")}</strong></div>
          <div style="background:var(--surface-alt);padding:10px;border-radius:8px;font-size:12px;">🔧 Ferramentas: <strong>${(appState.toolList || []).length}</strong></div>
          <div style="background:var(--surface-alt);padding:10px;border-radius:8px;font-size:12px;">📦 Materiais: <strong>${(appState.allMaterials || []).length}</strong></div>
          <div style="background:var(--surface-alt);padding:10px;border-radius:8px;font-size:12px;">⏳ OS Pendentes: <strong>${osPendentes}</strong></div>
          <div style="background:var(--surface-alt);padding:10px;border-radius:8px;font-size:12px;">✅ OS concluídas no dia: <strong>${osConcluidasHoje}</strong></div>
        </div>
      </div>

      <div class="card-box">
        <h3 style="margin:0 0 10px;font-size:15px;">Histórico de OS</h3>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px;">OS finalizadas em datas anteriores ficam disponíveis aqui.</div>
        <button class="btn-action btn-outline btn-full" onclick="abrirHistoricoOSAntigas()">📚 Ver OS finalizadas anteriormente</button>
      </div>
    `;
    }

  </script>
  <!-- Firebase 08: login com logo e perfis multiplos; compatível com perfil único. -->
</body>

</html>
